<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 JavaScript</title>
</head>
<body>
    <h1>Tugas 3 JavaScript</h1>

    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        //penjumlahan
        let hasil = angka1 + angka2;
        document.write("Hasil Penjumlahan : " + hasil + "<br>");

        //pengurangan
        hasil = angka1 - angka2;
        document.write("Hasil Pengurangan : " + hasil + "<br>");

        //perkalian
        hasil = angka1 * angka2;
        document.write("Hasil Perkalian : " + hasil + "<br>");

        //pembagian
        hasil = angka1 / angka2;
        document.write("Hasil Pembagian : " + hasil + "<br>");
    </script>
</body>
</html>
